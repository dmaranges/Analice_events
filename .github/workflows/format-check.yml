name: TypeScript formatting check

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  prettier-check:
    name: Check src formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and TSX formatting
        run: npm run format:check
