name: TypeScript formatting check

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  prettier-check:
    name: Check src formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -euxo pipefail
          echo "Installing dependencies with npm ci"
          npm ci
          echo "Prettier: $(npx prettier --version)"

      - name: Show environment information
        run: |
          set -euxo pipefail
          echo "::group::Environment"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Prettier: $(npx prettier --version)"
          echo "Runner: $RUNNER_OS"
          echo "Commit: $GITHUB_SHA"
          echo "::endgroup::"

          {
            echo "### Formatting check environment"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Prettier: $(npx prettier --version)"
            echo "- Runner: $RUNNER_OS"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show formatting configuration
        run: |
          set -euxo pipefail
          echo "::group::TypeScript and TSX files"
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print | sort
          echo "::endgroup::"
          echo "::group::Prettier configuration"
          npx prettier --find-config-path src/main.tsx
          echo "::endgroup::"

      - name: Check TypeScript and TSX formatting
        run: |
          set -euxo pipefail
          echo "Running npm run format:check"
          npm run format:check

      - name: Show formatting failure details
        if: failure()
        run: |
          set +e
          echo "::group::Formatting failure details"
          echo "Formatting check failed"
          echo "Files that Prettier considers different are listed above"
          git diff --stat || true
          git diff || true
          echo "::endgroup::"
